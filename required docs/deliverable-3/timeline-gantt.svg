  <text x="545" y="58" class="header">15 Oct</text>
  <text x="805" y="58" class="header">3 Nov</text>
  <text x="990" y="58" class="header">6 Nov deadline</text>
  <line x1="380" y1="65" x2="380" y2="395" class="grid"/>
  <line x1="545" y1="65" x2="545" y2="395" class="grid"/>
  <line x1="805" y1="65" x2="805" y2="395" class="grid"/>
  <line x1="990" y1="65" x2="990" y2="395" class="grid"/>
  <line x1="1050" y1="65" x2="1050" y2="395" class="grid"/>
  <text x="20" y="88">Booking/concurrency isolation</text><rect x="380" y="76" width="175" height="18" rx="3" class="done"/>
  <text x="20" y="121">Dependency remediation</text><rect x="805" y="109" width="110" height="18" rx="3" class="done"/>
  <text x="20" y="154">Availability fixture isolation</text><rect x="805" y="142" width="110" height="18" rx="3" class="done"/>
  <text x="20" y="187">Backend tests/coverage checkpoint</text><rect x="805" y="175" width="110" height="18" rx="3" class="done"/>
  <text x="20" y="220">Frontend quality and coverage</text><rect x="990" y="208" width="60" height="18" rx="3" class="verified"/>
  <text x="20" y="253">Performance/load/optimization</text><rect x="990" y="241" width="60" height="18" rx="3" class="pending"/>
  <text x="20" y="286">Isolated PostgreSQL recovery</text><rect x="990" y="274" width="60" height="18" rx="3" class="pending"/>
  <text x="20" y="319">Jira/dashboard/traceability</text><rect x="990" y="307" width="60" height="18" rx="3" class="pending"/>
  <text x="20" y="352">Submission packaging</text><rect x="990" y="340" width="60" height="18" rx="3" class="pending"/>
  <rect x="790" y="385" width="14" height="14" class="done"/><text x="810" y="397" class="small">fixed/evidenced</text>
  <rect x="910" y="385" width="14" height="14" class="verified"/><text x="930" y="397" class="small">verified locally</text>
  <rect x="1020" y="385" width="14" height="14" class="pending"/><text x="1040" y="397" class="small">pending</text>
