<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">Campus Duo Deliverable 3 timeline</title>
  <desc id="desc">Gantt chart from 14 October through 6 November 2026. Completed work is green, verified local work is blue, and pending work is amber.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #202124; font-size: 13px; }
    .small { font-size: 11px; }
    .grid { stroke: #d7dbe0; stroke-width: 1; }
    .done { fill: #2e7d32; }
    .verified { fill: #1565c0; }
    .pending { fill: #f9a825; }
    .header { font-weight: 700; }
  </style>
  <rect width="1100" height="430" fill="white"/>
  <text x="20" y="24" class="header">Campus Duo — CS455 Deliverable 3 Gantt</text>
  <text x="20" y="43" class="small">Actual dates are evidence-backed; reconstructed planning dates are labeled in the editable CSV.</text>
  <line x1="380" y1="65" x2="1050" y2="65" class="grid"/>
